name: Android APK

# main에 코드가 올라오면(문서 변경 제외) 서명된 APK를 만들어 Releases에 올린다.
# Actions 탭 → Android APK → Run workflow 로 직접 실행할 수도 있다.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write   # Release 만들기에만 사용

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - name: 서명 키 확인
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::서명 키가 없어 빌드만 확인합니다 (Release 안 올림)."
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 웹 파일 준비 + 안드로이드 프로젝트에 복사
        run: |
          npm ci --no-audit --no-fund
          npm run build:web
          npx cap sync android

      - name: APK 빌드 (서명 포함)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ "${{ steps.key.outputs.signed }}" = "true" ]; then
            export KEYSTORE_FILE="$RUNNER_TEMP/release.p12"
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          fi
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          rm -f "$RUNNER_TEMP/release.p12"

      - name: 서명 확인
        if: steps.key.outputs.signed == 'true'
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee signer.txt
          mkdir -p dist
          cp "$APK" "dist/work-calendar-$VERSION_NAME.apk"

      - name: 서명 키 없음
        if: steps.key.outputs.signed != 'true'
        run: |
          ls -la android/app/build/outputs/apk/release/
          echo "::error::빌드는 성공. Settings → Secrets and variables → Actions 에 KEYSTORE_BASE64, KEYSTORE_PASSWORD 를 등록한 뒤 Run workflow 로 다시 실행하세요."
          exit 1

      - name: Release 올리기
        if: steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE="dist/work-calendar-$VERSION_NAME.apk"
          SHA=$(sha256sum "$FILE" | cut -d' ' -f1)
          CERT=$(grep -m1 'SHA-256 digest' signer.txt | sed 's/.*: //')
          cat > notes.md <<EOF
          업무캘린더 안드로이드 앱 v$VERSION_NAME

          **설치:** 폰에서 아래 \`work-calendar-$VERSION_NAME.apk\` 를 눌러 받은 뒤 열기.
          이미 설치돼 있으면 그 위에 업데이트로 설치된다 (데이터 유지).

          - 커밋: ${GITHUB_SHA::7}
          - APK SHA-256: \`$SHA\`
          - 서명 인증서 SHA-256: \`$CERT\` (매 버전 같아야 정상)
          EOF
          gh release create "v$VERSION_NAME" "$FILE" --title "업무캘린더 v$VERSION_NAME" --notes-file notes.md --target "$GITHUB_SHA"
