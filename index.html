<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>업무 캘린더</title>
<meta name="theme-color" content="#2f6fed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="업무캘린더">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="config.js"></script>
<style>
:root{
  --bg:#f2f4f8; --surface:#ffffff; --surface2:#e9edf3; --text:#191e26; --muted:#5d6675;
  --line:#dde2ea; --accent:#2f6fed; --accent-weak:#e6eefc; --danger:#d93a3a; --ok:#1f9d55;
  --sun:#d93a3a; --sat:#2f6fed; --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 12px rgba(16,24,40,.05);
  color-scheme:light;
  --inset-top:max(env(safe-area-inset-top, 0px), var(--safe-area-inset-top, 0px));
  --inset-bottom:max(env(safe-area-inset-bottom, 0px), var(--safe-area-inset-bottom, 0px));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111316; --surface:#1a1d22; --surface2:#24282f; --text:#e8eaed; --muted:#9aa0a8;
    --line:#2c3138; --accent:#6d9bff; --accent-weak:#1e2944; --danger:#ff6b6b; --ok:#46c287;
    --sun:#ff7a7a; --sat:#7ea6ff; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111316; --surface:#1a1d22; --surface2:#24282f; --text:#e8eaed; --muted:#9aa0a8;
  --line:#2c3138; --accent:#6d9bff; --accent-weak:#1e2944; --danger:#ff6b6b; --ok:#46c287;
  --sun:#ff7a7a; --sat:#7ea6ff; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
main{max-width:760px;margin:0 auto;padding:calc(16px + var(--inset-top)) 16px calc(150px + var(--inset-bottom))}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 16px}
.top h1{font-size:23px;margin:2px 0 0;letter-spacing:-.02em}
.eyebrow{font-size:13px;color:var(--muted);font-weight:600}
.navbtns{display:flex;gap:6px;flex:none}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;cursor:pointer;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px}
.icon-btn{flex:none;width:34px;height:34px;border:0;background:none;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--surface2)}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* polish: keyboard focus, aligned digits, balanced headings, calm motion */
@media (hover:hover){
  .btn,.icon-btn,.cell,.check,.sw,.wdsel button,.seg button,nav.tabs button,.tw-main,.card-main{transition:background-color .12s ease,border-color .12s ease,color .12s ease,box-shadow .12s ease}
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.inp:focus-visible{outline:none}
.cell:focus-visible,.check:focus-visible,.card-main:focus-visible,.tw-main:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:8px}
.summary,.mgrid,.day-h .dn,.stat b,.card-meta,.chip,.tw-count,.od-right,kbd{font-variant-numeric:tabular-nums}
h1,h2,.sheet-h h2,.pane-head h2{text-wrap:balance}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important;scroll-behavior:auto!important} }

/* summary */
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:24px;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.stat.warn b{color:var(--danger)}
.overall{margin:12px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.overall .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}
.overall .bar{height:8px}
.overall .bar i{background:var(--ok)}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin:22px 0 8px;font-size:14px;font-weight:700;color:var(--muted)}
.sec-h.warn{color:var(--danger)}
.overdue-h{width:100%;border:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:0;font:inherit}
.overdue-h .od-right{display:inline-flex;align-items:center;gap:2px;font-size:13px}
.overdue-h svg{width:16px;height:16px}
.od-hint{font-size:12px;color:var(--muted);padding:2px 2px 4px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);font-size:14px}
.empty .btn{margin-top:10px}

/* card */
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;margin-bottom:8px;box-shadow:var(--shadow);overflow:hidden}
.card-row{display:flex;align-items:center;gap:2px;padding:6px 4px 6px 6px;min-height:40px}
.check{flex:none;width:28px;height:28px;margin:0 6px 0 4px;border-radius:8px;border:2px solid var(--line);background:transparent;color:transparent;display:grid;place-items:center;cursor:pointer;padding:0}
.check svg{width:16px;height:16px;stroke-width:3}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.card-main{flex:1;min-width:0;text-align:left;background:none;border:0;padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.card-title{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1.2em}
.card.done .card-title{text-decoration:line-through;color:var(--muted)}
.card-meta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:6px;background:var(--surface2);color:var(--muted);margin-left:2px}
.bar{display:block;height:4px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:4px}
.sub{padding:2px 14px 10px 46px;border-top:1px dashed var(--line)}
.sub-h{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 2px;display:flex;justify-content:space-between}
.sub-item{display:flex;align-items:flex-start;gap:9px;padding:5px 0;font-size:14px;cursor:pointer}
.sub-item input{flex:none;width:18px;height:18px;accent-color:var(--ok);margin:1px 0 0;cursor:pointer}
.sub-item.on span{text-decoration:line-through;color:var(--muted)}
.memo{font-size:13px;color:var(--muted);white-space:pre-wrap;margin-top:10px}

/* week */
.day{margin-bottom:14px}
.day-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.day-h .dn{font-size:18px;font-weight:700;width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.day.today .dn{background:var(--accent);color:#fff}
.day-h .dw{font-size:13px;color:var(--muted);font-weight:600}
.day-h .cnt{margin-left:auto;font-size:12px;color:var(--muted)}
.day-empty{font-size:13px;color:var(--muted);padding:2px 0 4px 38px}
.sun{color:var(--sun)!important}.sat{color:var(--sat)!important}

/* month */
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:var(--shadow)}
.dow{text-align:center;font-size:12px;color:var(--muted);padding:4px 0 6px;font-weight:600}
.cell{min-height:72px;border:0;background:none;border-radius:8px;padding:3px 2px;text-align:left;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-width:0}
.cell:hover{background:var(--surface2)}
.cell .n{font-size:12px;font-weight:600;width:22px;height:22px;display:grid;place-items:center;border-radius:50%;margin-left:1px}
.cell.today .n{background:var(--accent);color:#fff!important}
.cell.sel{background:var(--accent-weak)}
.cell.other{opacity:.38}
.chip{display:block;font-style:normal;font-size:10.5px;line-height:15px;padding:0 3px;border-radius:3px;background:var(--surface2);
  background:color-mix(in srgb,var(--c) 18%,transparent);border-left:2px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.done{opacity:.5;text-decoration:line-through}
.more{font-style:normal;font-size:10px;color:var(--muted);padding-left:3px}

/* settings */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.prow{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .grow{flex:1;min-width:0}
.prow .t{font-weight:600}
.prow .d{font-size:12px;color:var(--muted)}
.dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--c)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-size:13px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:#fff}
.note{font-size:12px;color:var(--muted);margin:8px 2px 0}
kbd{display:inline-block;min-width:24px;padding:2px 7px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;background:var(--bg);
  font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;text-align:center;color:var(--text)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:9px 14px;align-items:center;font-size:14px;margin:4px 0 8px}
.keys .k{display:flex;gap:4px;flex-wrap:wrap}
.keys h3{grid-column:1/-1;font-size:13px;color:var(--muted);margin:12px 0 0}
.desk-only{display:none!important}
@media (hover:hover) and (pointer:fine){ .desk-only{display:flex!important} }

/* nav + fab */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;padding-bottom:var(--inset-bottom)}
nav.tabs .inner{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;color:var(--muted);font-size:11px;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav.tabs button.on{color:var(--accent);font-weight:700}
nav.tabs svg{width:22px;height:22px}
.fab{position:fixed;right:max(16px,calc(50vw - 364px));bottom:calc(78px + var(--inset-bottom));width:54px;height:54px;border-radius:50%;
  background:var(--accent);color:#fff;border:0;box-shadow:0 6px 18px rgba(0,0,0,.22);display:grid;place-items:center;z-index:21;cursor:pointer}
.fab svg{width:26px;height:26px}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:calc(100vh - var(--inset-top) - 24px);overflow:auto;border-radius:18px 18px 0 0;padding:6px 16px calc(16px + var(--inset-bottom))}
@media (min-width:700px){.backdrop{align-items:center}.sheet{border-radius:18px;max-height:88vh}}
.sheet-h{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;justify-content:space-between;padding:10px 0;z-index:1}
.sheet-h h2{font-size:18px;margin:0}
.field{margin:12px 0}
.label{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;outline:none}
.inp:focus{border-color:var(--accent)}
textarea.inp{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:28px;height:28px;border-radius:50%;border:3px solid transparent;background:var(--c);cursor:pointer;padding:0}
.sw.on{border-color:var(--text)}
.sw{position:relative;display:inline-grid;place-items:center}
.sw-add{background:var(--surface2);border:1px dashed var(--line);color:var(--muted);font-size:18px;font-weight:700;overflow:hidden}
.sw-add input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;padding:0;border:0}
.sw-del{position:absolute;top:-4px;right:-4px;width:15px;height:15px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--text);font-size:11px;line-height:13px;display:grid;place-items:center}
.le-row{display:flex;gap:4px;align-items:center;margin-bottom:6px}
.le-row .inp{padding:7px 10px}
.le-row .num{flex:none;width:20px;text-align:right;font-size:12px;color:var(--muted)}
.actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.actions .spacer{flex:1}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.wdsel{display:flex;gap:5px;flex-wrap:wrap}
.wdsel button{flex:1;min-width:38px;height:38px;border:1px solid var(--line);background:var(--bg);border-radius:9px;cursor:pointer;font-size:14px;color:var(--muted)}
.wdsel button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.wdsel button.sun.on{background:var(--danger);border-color:var(--danger)}
.wdsel button.sat.on{background:var(--sat);border-color:var(--sat)}
.del-opts{display:flex;flex-direction:column;gap:8px;margin:4px 0}
.del-opt{justify-content:space-between;padding:12px 14px;font-size:15px}
.del-opt[data-scope="all"]{color:var(--danger)}
.notes-list{display:grid;gap:10px;grid-template-columns:1fr}
/* 메모 워크스페이스 */
.notes-root{display:flex;flex-direction:column;height:100%}
.notes-tree{display:flex;flex-direction:column;min-height:0;flex:1}
.tree-toolbar{display:flex;gap:6px;align-items:center;padding:0 0 10px}
.tree-search{display:flex;gap:4px;align-items:center;margin:0 0 8px}
.tree-search .inp{padding:7px 10px;font-size:13px}
.md-view mark,.note-view mark{background:#ffe88a;color:#4a3b00;border-radius:3px;padding:0 2px}
:root[data-theme="dark"] .md-view mark,:root:not([data-theme="light"]) .md-view mark{background:#6b5a12;color:#ffe88a}
.md-view strong{font-weight:700}
.md-view u{text-decoration-thickness:1.5px;text-underline-offset:2px}
.tree-scroll{flex:1;min-height:0;overflow:auto}
.tree-row{display:flex;align-items:center;gap:2px;border-radius:8px;padding-left:calc(var(--d,0) * 16px)}
.tree-row:hover{background:var(--surface2)}
.note-row.sel{background:var(--accent-weak)}
.tree-row[draggable=true]{cursor:default}
.tw-grip{cursor:grab;opacity:0}
.note-row:hover .tw-grip{opacity:.5}
.tree-row.dragging{opacity:.4}
.tree-row.drop-into{background:color-mix(in srgb,var(--accent) 16%,transparent);outline:1.5px dashed var(--accent);outline-offset:-2px;border-radius:8px}
.tree-row.drop-before{box-shadow:inset 0 2px 0 0 var(--accent)}
.tree-row.drop-after{box-shadow:inset 0 -2px 0 0 var(--accent)}
.tree-scroll.drop-root{outline:1.5px dashed var(--line);outline-offset:-4px;border-radius:10px}
.tw-chev{flex:none;width:24px;height:30px;border:0;background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0}
.tw-chev svg{width:15px;height:15px}
.tw-dot{width:5px;height:5px;border-radius:50%;background:var(--line)}
.tw-main{flex:1;min-width:0;display:flex;align-items:center;gap:7px;border:0;background:none;cursor:pointer;padding:6px 4px;text-align:left;color:var(--text);font-size:14px}
.tw-ic{flex:none;color:var(--muted);display:grid;place-items:center}
.tw-ic svg{width:17px;height:17px}
.tw-ic.note svg{width:15px;height:15px}
.tw-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folder-row .tw-name{font-weight:600}
.tw-count{flex:none;font-size:11px;color:var(--muted);background:var(--surface2);border-radius:9px;padding:0 6px}
.tw-acts{flex:none;display:flex;gap:0;opacity:0}
.tree-row:hover .tw-acts,.trash-row .tw-acts{opacity:1}
.icon-btn.xs{width:26px;height:26px}
.icon-btn.xs svg{width:15px;height:15px}
.icon-btn.danger{color:var(--danger)}
.trash-row{padding:7px 4px;gap:8px}
.trash-row .tw-name{flex:1}
.move-list{display:flex;flex-direction:column;gap:4px;max-height:50vh;overflow:auto}
.move-opt{justify-content:flex-start;text-align:left}
.move-opt.on{border-color:var(--accent);color:var(--accent);font-weight:700}
@media (hover:none){ .tw-acts{opacity:1} }   /* 터치 기기는 액션 항상 보이게 */
@media (min-width:1024px){
  .notes-root{flex-direction:row;gap:0;height:100%}
  .notes-tree{flex:0 0 310px;border-right:1px solid var(--line);padding-right:12px}
  .notes-pane{flex:1;min-width:0;overflow:auto;padding:0 4px 20px 22px}
  .notes-pane.empty-pane{display:grid;place-items:center}
  .pane-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:0 0 10px}
  .pane-head h2{font-size:22px;margin:2px 0 0;letter-spacing:-.01em}
  :root[data-view="notes"] .shell{grid-template-columns:var(--sidew) minmax(0,1fr) 0}
  :root[data-view="notes"] .todo{display:none}
  :root[data-view="notes"] main{display:flex;flex-direction:column}
}
@media (min-width:640px){ .notes-list{grid-template-columns:1fr 1fr} }
.note-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;overflow:hidden}
.note-card:hover{border-color:var(--accent)}
.note-card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.note-card-h b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-card-h .icon-btn{flex:none;width:26px;height:26px;color:var(--muted)}
.note-body{font-size:13px;color:var(--muted);white-space:pre-wrap;line-height:1.5;max-height:160px;overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,#000 72%,transparent);mask-image:linear-gradient(180deg,#000 72%,transparent)}
.note-body .muted{opacity:.7}
.note-title{font-size:17px;font-weight:700}
textarea.note-area{min-height:300px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;overflow:auto;font-size:16.5px;tab-size:2}
.md-toolbar{display:flex;gap:6px;margin:0 0 8px}
.md-toolbar .btn{min-width:38px}
:root{--note-fs:16.5px}
:root[data-notefont="s"]{--note-fs:14.5px}
:root[data-notefont="l"]{--note-fs:19px}
.md-view{font-size:var(--note-fs);line-height:1.75}
textarea.note-body-ta{font-size:var(--note-fs)}
.md-view .md-hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.md-view .md-link{color:var(--accent);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 45%,transparent);cursor:pointer}
.md-view .md-link:hover{background:var(--accent-weak);border-radius:3px}
.md-view .md-link.broken{color:var(--muted);border-bottom-style:dashed}
.md-view .md-tag{color:var(--accent);background:var(--accent-weak);border-radius:6px;padding:0 6px;font-size:.9em;text-decoration:none;cursor:pointer;white-space:nowrap}
.md-view .md-tag:hover{filter:brightness(.97)}
.backlinks-label{margin-top:18px}
.backlinks{display:flex;flex-direction:column;gap:4px}
.backlink{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 10px;cursor:pointer;font-size:14px;color:var(--text);text-align:left}
.backlink:hover{border-color:var(--accent);background:var(--surface2)}
.backlink svg{width:15px;height:15px;color:var(--muted);flex:none}
.backlink span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  main:has(.mgrid){display:flex;flex-direction:column}       /* 월별: 달력이 남는 높이를 채움 */

function legacyNoteBody(nt){   // {steps:[{text,desc}], memo} 형태를 본문 텍스트로 변환

/* 바뀐 항목에 수정 시각을, 사라진 항목에 삭제 기록을 남긴다 (동기화 병합용) */
const stripTs = o => { const { updatedAt, ...rest } = o; return JSON.stringify(rest); };

function stamp(){
  const now = Date.now(), seen = new Set();
  for (const x of [...state.events, ...state.templates, ...state.notes, ...state.folders, ...state.noteTemplates]){
    seen.add(x.id);
    if (snap.get(x.id) !== stripTs(x)) x.updatedAt = now;
  }

function nthWeekdayLabel(d){
  const n = weekOfMonth(d);
  return `${n>=5?'마지막':ORD_KO[n-1]} 주 ${DOW[d.getDay()]}요일`;   // 다섯째는 없는 달이 있어 '마지막 주'로

function nthWeekdayDate(year, month, weekday, nth){                  // month 0~11, nth 1~4 또는 'last'
  if (nth === 'last' || nth >= 5){
    const lastDay = new Date(year, month+1, 0).getDate();
    const lastDow = new Date(year, month, lastDay).getDay();
    return new Date(year, month, lastDay - ((lastDow - weekday + 7) % 7));
  }
  const firstDow = new Date(year, month, 1).getDay();
  return new Date(year, month, 1 + ((weekday - firstDow + 7) % 7) + (nth-1)*7);
}
const orderedDows = () => Array.from({length:7}, (_, i) => (state.settings.weekStart + i) % 7);   // 설정의 주 시작부터
const weekdaysOf = d => (d.weekdays && d.weekdays.length) ? d.weekdays : [parse(d.date).getDay()]; // 기본은 시작일 요일

// 삭제용 묶음: 반복 묶음이 있으면 그걸로, 없으면(옛 반복) 제목·시간·색이 같은 일정을 한 묶음으로 본다

}
const cmpEv = (a,b) => a.date.localeCompare(b.date) || (a.done?1:0) - (b.done?1:0) || ordOf(a) - ordOf(b) || (a.time||'').localeCompare(b.time||'') || a.title.localeCompare(b.title);   // 완료한 일정은 그 날짜 안에서 맨 뒤로
function nextOrder(date, exceptId){                                    // 그날 순서를 정해 둔 상태면 맨 뒤 번호
  const os = state.events.filter(e => e.date === date && e.id !== exceptId && Number.isFinite(e.order)).map(e => e.order);
  return os.length ? Math.max(...os) + 1 : undefined;
}
function reorderDay(date, id, to){
  const list = eventsOn(date);
  const from = list.findIndex(e => e.id === id);
  if (from < 0) return;
  to = Math.max(0, Math.min(list.length - 1, to));
  if (from === to) return;
  const [x] = list.splice(from, 1); list.splice(to, 0, x);

function viewWeek(){
  const start = weekStartOf(parse(ui.weekAnchor));
  const end = addDays(start, 6);
  const t = todayStr();
  const range = start.getMonth() === end.getMonth()
    ? `${start.getMonth()+1}월 ${start.getDate()}일 – ${end.getDate()}일`
    : `${start.getMonth()+1}월 ${start.getDate()}일 – ${end.getMonth()+1}월 ${end.getDate()}일`;
  let total = 0, done = 0, days = '';
  for (let i = 0; i < 7; i++){

/* ---------- 모달: 일정 / 템플릿 편집 ---------- */
const mkItem = text => ({ id:uid(), text, done:false });
function openEvent(id, date, tplId){
  const ev = id && state.events.find(e => e.id === id);
  const draft = ev ? JSON.parse(JSON.stringify(ev)) : {
    id:uid(), title:'', date: date || todayStr(), time:'', memo:'', color:COLORS[0], templateId:'', done:false, tasks:[], items:[],
    repeat:'none', repeatCount:4, monthMode:'date'
  };
  modal = { type:'event', isNew:!ev, draft };
  pushModalState();
  if (tplId) applyTemplate(tplId, true);
  renderModal();
  if (!ev && !tplId) setTimeout(() => { const f = document.querySelector('[data-f="title"]'); f && f.focus(); }, 30);
}
function openTemplate(id){
  const tp = id && tplById(id);
  const draft = tp
    ? { ...tp, tasks: tp.tasks.map(mkItem), items: tp.items.map(mkItem) }
    : { id:uid(), name:'', color:COLORS[2], time:'', memo:'', category:'', fav:false, tasks:[], items:[] };
  modal = { type:'template', isNew:!tp, draft };
  pushModalState();
  renderModal();
}
function applyTemplate(tplId, silent){
  const d = modal.draft;
  d.templateId = tplId;
  const tp = tplById(tplId);
  if (!tp) return;
  const hasLists = d.tasks.some(x=>x.text.trim()) || d.items.some(x=>x.text.trim());
  if (hasLists && !silent && !confirm('지금 체크리스트를 템플릿 내용으로 바꿀까요?')) return;
  fillFromTemplate(d, tp);
}
function fillFromTemplate(d, tp){
  d.templateId = tp.id;
  if (!d.title.trim()) d.title = tp.name;
  if (!d.time && tp.time) d.time = tp.time;
  if (!d.memo && tp.memo) d.memo = tp.memo;
  d.color = tp.color;
  d.tasks = tp.tasks.map(mkItem);
  d.items = tp.items.map(mkItem);
}
function listEditor(kind, label, arr){
  return `<div class="field"><div class="label"><span>${label}</span><span>${arr.length}개</span></div>
    ${arr.map((it,i) => `<div class="le-row"><span class="num">${i+1}</span><input class="inp" data-le="${kind}" data-i="${i}" value="${esc(it.text)}" aria-label="${label} ${i+1}">
      <button class="icon-btn" data-act="le-del" data-kind="${kind}" data-i="${i}" aria-label="삭제">${ICON.x}</button></div>`).join('')}
    <div class="le-row"><span class="num"></span><input class="inp" data-le-new="${kind}" placeholder="항목 입력 후 Enter">
      <button class="icon-btn" data-act="le-add" data-kind="${kind}" aria-label="추가">${ICON.plus}</button></div></div>`;
}
function colorField(cur){
  const custom = (state.settings.customColors || []).filter(c => !COLORS.includes(c));
  const all = [...COLORS, ...custom];
  const sw = c => `<button class="sw ${c===cur?'on':''}" style="--c:${c}" data-act="color" data-v="${c}" aria-label="색상 ${c}">${custom.includes(c) ? `<span class="sw-del" data-act="color-del" data-v="${c}" title="이 색 삭제">×</span>` : ''}</button>`;
  return `<div class="field"><div class="label">색상</div><div class="swatches">${all.map(sw).join('')}
    <label class="sw sw-add" title="색 직접 고르기"><span>+</span><input type="color" data-color-add value="${/^#[0-9a-f]{6}$/i.test(cur)?cur:'#2f6fed'}"></label></div></div>`;
}
function addCustomColor(hex){
  hex = (hex || '').toLowerCase();
  if (!/^#[0-9a-f]{6}$/.test(hex) || !modal) return;
  const cc = state.settings.customColors || (state.settings.customColors = []);
  if (!COLORS.includes(hex) && !cc.includes(hex)){ cc.unshift(hex); if (cc.length > 16) cc.length = 16; persist(); }
  modal.draft.color = hex; renderModal();
}

function pushModalState(){ if (!(history.state && history.state.modal)) history.pushState({ modal:1 }, ''); }

function closeModal(){
  modal = null; renderModal();

const cleanList = arr => arr.map(x => ({...x, text:x.text.trim()})).filter(x => x.text);

function saveEvent(){
  const d = modal.draft;
  if (!d.title.trim()){ toast('제목을 입력해 주세요'); return; }
  if (!d.date){ toast('날짜를 선택해 주세요'); return; }
  const base = { id:d.id, title:d.title.trim(), date:d.date, time:d.time, memo:d.memo, color:d.color, templateId:d.templateId, done:d.done,
                 tasks:cleanList(d.tasks), items:cleanList(d.items) };
  const prev = state.events.find(e => e.id === d.id);
  const ord = prev && prev.date === d.date ? prev.order : nextOrder(d.date, d.id);   // 날짜를 옮기면 그날 맨 뒤로
  if (Number.isFinite(ord)) base.order = ord;
  if (modal.isNew){
    const n = d.repeat === 'none' ? 1 : Math.max(1, Math.min(52, parseInt(d.repeatCount,10) || 1));
    const start = parse(d.date);
    const dates = [];
    if (d.repeat === 'weekly'){
      const days = [...new Set(weekdaysOf(d))].sort((a,b) => a - b);
      const wkBase = weekStartOf(start);                               // 시작일이 속한 주의 시작
      for (let w = 0; w < n; w++) for (const dw of days){
        const dt = addDays(wkBase, w*7 + ((dw - state.settings.weekStart + 7) % 7));
        if (dt >= start) dates.push(dt);                               // 시작일 이전 요일은 제외
      }
    } else if (d.repeat === 'monthly' && d.monthMode === 'weekday'){
      let occ = weekOfMonth(start); if (occ >= 5) occ = 'last';        // 다섯째 주로 시작하면 매달 마지막 주
      for (let i = 0; i < n; i++) dates.push(nthWeekdayDate(start.getFullYear(), start.getMonth()+i, start.getDay(), occ));
    } else if (d.repeat === 'monthly'){
      for (let i = 0; i < n; i++){
        const last = new Date(start.getFullYear(), start.getMonth()+i+1, 0).getDate();
        dates.push(new Date(start.getFullYear(), start.getMonth()+i, Math.min(start.getDate(), last)));
      }
    } else dates.push(start);
    dates.sort((a,b) => a - b);
    const seriesId = dates.length > 1 ? uid() : null;                  // 2개 이상이면 반복 묶음으로 연결
    dates.forEach((dt, i) => {
      const o = nextOrder(ymd(dt));
      state.events.push({ ...base, id: i ? uid() : base.id, date: ymd(dt), ...(Number.isFinite(o) ? { order:o } : { order:undefined }),
        ...(seriesId ? { seriesId } : {}),
        tasks: base.tasks.map(x => ({...x, id:uid()})), items: base.items.map(x => ({...x, id:uid()})) });
    });
    const wdLabel = d.repeat==='weekly' ? '매주 '+[...new Set(weekdaysOf(d))].sort((a,b)=>a-b).map(x=>DOW[x]).join('·')+', ' : d.repeat==='monthly'&&d.monthMode==='weekday' ? '매월 '+nthWeekdayLabel(start)+', ' : '';
    toast(dates.length > 1 ? `${wdLabel}일정 ${dates.length}개를 만들었어요` : '일정을 추가했어요');
  } else {
    const prevEv = state.events.find(e => e.id === d.id);
    if (prevEv && seriesMembers(prevEv).length > 1){                    // 반복 묶음이면 적용 범위를 묻는다
      modal = { type:'edit-scope', orig: prevEv, base, oldDate: prevEv.date };
      renderModal();
      return;
    }
    const i = state.events.findIndex(e => e.id === d.id);
    if (i >= 0) state.events[i] = base; else state.events.push(base);   // 편집 중 다른 기기에서 지워졌으면 다시 살린다
    toast('저장했어요');
  }
  save(); closeModal(); render();
}
function saveTemplate(){
  const d = modal.draft;
  if (!d.name.trim()){ toast('템플릿 이름을 입력해 주세요'); return; }
  const tp = { id:d.id, name:d.name.trim(), color:d.color, time:d.time, memo:d.memo,
               category:(d.category||'').trim(), fav:!!d.fav,
               tasks:cleanList(d.tasks).map(x=>x.text), items:cleanList(d.items).map(x=>x.text) };
  const i = state.templates.findIndex(t => t.id === d.id);

// 데스크톱 월별: 칸 높이에 들어갈 만큼만 일정 칩을 보이고 나머지는 +N 으로 접는다
function fitMonthCells(){
  if (!isDesk() || ui.view !== 'month') return;
  document.querySelectorAll('#app .mgrid .cell').forEach(cell => {
    const n = cell.querySelector('.n'); if (!n) return;
    const chips = [...cell.querySelectorAll('.chip')];
    const oldMore = cell.querySelector('.more'); if (oldMore) oldMore.remove();
    chips.forEach(c => { c.style.display = ''; });
    if (!chips.length) return;
    const cs = getComputedStyle(cell);
    const gap = parseFloat(cs.rowGap || cs.gap) || 0;
    const padV = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
    const avail = cell.clientHeight - padV - n.offsetHeight - gap - 4; // 날짜 숫자 아래 칩들이 쓸 수 있는 높이(+안전여백)
    const chipH = chips[0].offsetHeight + gap;
    if (chipH <= 0) return;
    const full = Math.floor((avail + gap) / chipH);                   // 온전히 들어가는 칩 줄 수
    if (full >= chips.length) return;                                 // 다 들어가면 그대로
    const leftover = avail - full * chipH;                            // 마지막 칩 뒤 남는 높이
    const show = Math.max(1, leftover >= 16 ? full : full - 1);       // 남는 공간에 +N 배지가 들어가면 칩을 덜 지운다
    chips.forEach((c, i) => { if (i >= show) c.style.display = 'none'; });
    const more = document.createElement('i');
    more.className = 'more';
    more.textContent = `+${chips.length - show}`;
    cell.appendChild(more);
  });
}

/* 오른쪽 오늘 할 일 (컴퓨터) — 끌어서 놓거나 ▲▼로 우선순위 변경 */
function viewTodo(){
  const t = todayStr(), sd = ui.selDate || t, isToday = sd === t;
  const evs = eventsOn(sd), doneN = evs.filter(e => e.done).length;
  const overdue = isToday ? state.events.filter(e => e.date < t && !e.done).sort(cmpEv) : [];
  const pct = evs.length ? Math.round(doneN / evs.length * 100) : 0;
  return `
  <div class="top" style="margin:0 0 12px"><div><div class="eyebrow">${isToday ? '오늘 할 일' : '선택한 날짜'} · ${doneN}/${evs.length} 완료</div><h2>${fmtLong(sd)}</h2></div>
    <div style="display:flex;gap:4px">
      ${isToday ? '' : `<button class="btn sm" data-act="todo-today" title="오늘로">오늘</button>`}
      <button class="icon-btn" data-act="new-ev" data-date="${sd}" title="이 날 일정 추가" aria-label="이 날 일정 추가">${ICON.plus}</button></div></div>
  ${evs.length ? `<div class="overall" style="margin:0 0 14px"><div class="row"><span>진행률</span><span>${pct}%</span></div><span class="bar"><i style="width:${pct}%"></i></span></div>
    ${evs.length > 1 ? '<div class="todo-hint">끌어서 놓거나 ▲▼로 우선순위를 바꿀 수 있어요</div>' : ''}
    <div data-drop-list="${sd}">${evs.map((e, i) => card(e, { reorder: i + 1 })).join('')}</div>`
    : `<div class="empty">${isToday ? '오늘' : '이 날은'} 할 일이 없어요.<br><button class="btn primary sm" data-act="new-ev" data-date="${sd}">일정 추가</button></div>`}
  ${overdueSection(overdue)}`;
}
function applyTheme(){

  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;

let toastTimer;
function toast(msg){

function fabDate(){
  if (ui.view === 'month') return ui.selDate;
  if (ui.view === 'week'){
    const s = weekStartOf(parse(ui.weekAnchor)), t = todayStr();

  }

}

/* ---------- 이벤트 처리 ---------- */
document.addEventListener('click', e => {
  if (e.target.id === 'fab' || e.target.closest('#fab')){ openEvent(null, fabDate()); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  const ev = id && state.events.find(x => x.id === id);
  switch (act){
    case 'tab': ui.view = el.dataset.v; scrollTop(); render(); break;
    case 'side-toggle': toggleSide(); break;
    case 'desk-pin': deskCall('set_pinned', { pinned: !(desk && desk.pinned) }); break;
    case 'desk-auto': deskCall('set_autostart', { enabled: !(desk && desk.autostart) }); break;
    case 'quick-close': closeQuick(); break;
    case 'quick-save': saveQuick(); break;
    case 'quick-more': quickMore(); break;
    case 'new-ev-here': openEvent(null, fabDate()); break;
    case 'move': {
      const evm = state.events.find(x => x.id === id); if (!evm) break;
      const idx = eventsOn(evm.date).findIndex(x => x.id === id);
      reorderDay(evm.date, id, idx + Number(el.dataset.dir)); break;
    }
    case 'toggle-ev':
      if (ev){ ev.done = !ev.done; save(); render(); if (ev.done) toast('완료 처리했어요'); } break;
    case 'toggle-sub': {
      if (!ev) break;
      const it = ev[el.dataset.kind].find(x => x.id === el.dataset.sub);
      if (!it) break;
      it.done = !it.done;
      const p = progress(ev);
      if (p.total && p.done === p.total && !ev.done){ ev.done = true; toast('체크리스트를 모두 끝냈어요 — 완료 처리!'); }
      else if (!it.done && ev.done){ ev.done = false; }
      save(); render(); break;
    }
    case 'expand': ui.expanded.has(id) ? ui.expanded.delete(id) : ui.expanded.add(id); render(); break;
    case 'toggle-overdue': ui.overdueOpen = !ui.overdueOpen; render(); break;
    case 'ev-today': {
      const evm = state.events.find(x => x.id === id); if (!evm) break;
      evm.date = todayStr(); delete evm.order;
      save(); render(); toast('오늘로 옮겼어요');
      break;
    }
    case 'edit-ev': openEvent(id); break;
    case 'new-ev': openEvent(null, el.dataset.date); break;
    case 'sel-date': {
      if (ui.selDate === el.dataset.date) break;
      ui.selDate = el.dataset.date;
      if (ui.selDate.slice(0,7) !== ui.monthAnchor) ui.monthAnchor = ui.selDate.slice(0,7);
      render(); break;
    }
    case 'todo-today': ui.selDate = todayStr(); if (ui.monthAnchor !== todayStr().slice(0,7)) ui.monthAnchor = todayStr().slice(0,7); render(); break;
    case 'week-prev': ui.weekAnchor = ymd(addDays(parse(ui.weekAnchor), -7)); render(); break;
    case 'week-next': ui.weekAnchor = ymd(addDays(parse(ui.weekAnchor), 7)); render(); break;
    case 'week-today': ui.weekAnchor = todayStr(); render(); break;
    case 'month-prev': case 'month-next': {
      const [y,m] = ui.monthAnchor.split('-').map(Number);
      const d = new Date(y, m-1 + (act==='month-prev'?-1:1), 1);
      ui.monthAnchor = `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
      ui.selDate = ui.monthAnchor === todayStr().slice(0,7) ? todayStr() : ui.monthAnchor + '-01';
      render(); break;
    }
    case 'month-today': ui.monthAnchor = todayStr().slice(0,7); ui.selDate = todayStr(); render(); break;
    case 'set-week': state.settings.weekStart = Number(el.dataset.v); save(); render(); break;
    case 'set-theme': state.settings.theme = el.dataset.v; save(); render(); break;
    case 'new-tpl': openTemplate(null); break;
    case 'tpl-filter': ui.tplFilter = (ui.tplFilter === el.dataset.v) ? '' : el.dataset.v; render(); break;
    case 'tpl-star': {
      const tp = tplById(id); if (tp){ tp.fav = !tp.fav; save(); render(); toast(tp.fav ? '즐겨찾기에 넣었어요' : '즐겨찾기에서 뺐어요'); }
      break;
    }
    case 'edit-tpl': openTemplate(id); break;
    case 'use-tpl': openEvent(null, fabDate(), id); break;
    case 'export': exportData(); break;
    case 'import': importData(); break;
    case 'clean-done': {
      const t = todayStr(), n = state.events.filter(x => x.done && x.date < t).length;
      if (!n){ toast('정리할 일정이 없어요'); break; }
      if (confirm(`완료된 지난 일정 ${n}개를 삭제할까요?`)){ state.events = state.events.filter(x => !(x.done && x.date < t)); save(); render(); toast(`${n}개 정리했어요`); }
      break;
    }
    case 'reset':
      if (confirm('모든 일정과 템플릿을 삭제할까요? 되돌릴 수 없어요.' + (syncCfg.key ? '\n(동기화된 다른 기기에서도 지워져요)' : ''))){

    case 'move-to': { const n = state.notes.find(x=>x.id===modal.noteId); if(n){ n.folderId = el.dataset.folder; ui.noteSel=n.id; save(); } closeModal(); render(); toast('옮겼어요'); break; }

      if (modal && modal.type === 'note-view') renderModal(); else render();

    case 'backdrop': if (e.target === el && backdropDown) closeModal(); break;
    case 'close': closeModal(); break;
    case 'color': modal.draft.color = el.dataset.v; renderModal(); break;
    case 'color-del': {
      e.stopPropagation();
      state.settings.customColors = (state.settings.customColors||[]).filter(c => c !== el.dataset.v);

      persist(); renderModal(); break;
    }
    case 'tpl-fav': modal.draft.fav = !modal.draft.fav; renderModal(); break;
    case 'wd-toggle': {
      const dr = modal.draft, v = Number(el.dataset.v);
      let days = weekdaysOf(dr).slice();
      days = days.includes(v) ? days.filter(x => x !== v) : [...days, v];

      renderModal(); break;
    }
    case 'le-add': {
      const kind = el.dataset.kind;
      const inp = document.querySelector(`[data-le-new="${kind}"]`);
      addListItem(kind, inp ? inp.value : ''); break;
    }
    case 'le-del': modal.draft[el.dataset.kind].splice(Number(el.dataset.i), 1); renderModal(); break;
    case 'save-ev': saveEvent(); break;
    case 'del-ev': {
      const cur = state.events.find(x => x.id === modal.draft.id);
      if (delGroup(cur).length > 1){ modal = { type:'delete', ev: cur, byTitle: !cur.seriesId }; renderModal(); }
      else if (confirm('이 일정을 삭제할까요?')){ state.events = state.events.filter(x => x.id !== modal.draft.id); save(); closeModal(); render(); toast('삭제했어요'); }
      break;
    }
    case 'edit-scope': {
      const { orig, base, oldDate } = modal;
      const fam = seriesMembers(orig), scope = el.dataset.scope;
      const delta = Math.round((parse(base.date) - parse(oldDate)) / 86400000);   // 날짜 이동량(일)
      const targets = scope === 'this' ? [orig] : scope === 'after' ? fam.filter(e => e.date >= oldDate) : fam;
      const tset = new Set(targets.map(t => t.id));
      state.events = state.events.map(t => {
        if (!tset.has(t.id)) return t;
        const self = t.id === orig.id;
        const newDate = self ? base.date : ymd(addDays(parse(t.date), delta));
        return { ...t, title: base.title, time: base.time, memo: base.memo, color: base.color, templateId: base.templateId,
          date: newDate, order: (t.date === newDate ? t.order : undefined),      // 날짜 바뀌면 그날 순서 초기화
          tasks: base.tasks.map(x => ({ text:x.text, id:uid(), done: self ? x.done : false })),
          items: base.items.map(x => ({ text:x.text, id:uid(), done: self ? x.done : false })) };
      });
      save(); closeModal(); render(); toast(`${targets.length}개에 적용했어요`);
      break;
    }
    case 'del-scope': {
      const ev = modal.ev, fam = delGroup(ev), scope = el.dataset.scope;
      let rm;
      if (scope === 'this') rm = new Set([ev.id]);
      else if (scope === 'after') rm = new Set(fam.filter(e => e.date >= ev.date).map(e => e.id));
      else if (scope === 'before') rm = new Set(fam.filter(e => e.date <= ev.date).map(e => e.id));
      else rm = new Set(fam.map(e => e.id));                           // all
      state.events = state.events.filter(x => !rm.has(x.id));
      save(); closeModal(); render(); toast(`${rm.size}개 삭제했어요`);
      break;
    }
    case 'save-as-tpl': {
      const d = modal.draft;
      const name = prompt('템플릿 이름', d.title.trim() || '새 템플릿');
      if (!name) break;
      const tp = { id:uid(), name:name.trim(), color:d.color, time:d.time, memo:d.memo,
                   tasks:cleanList(d.tasks).map(x=>x.text), items:cleanList(d.items).map(x=>x.text) };
      state.templates.push(tp); d.templateId = tp.id; save(); renderModal(); toast(`템플릿 “${tp.name}” 저장`);
      break;
    }
    case 'save-tpl': saveTemplate(); break;
    case 'del-tpl':
      if (confirm('이 템플릿을 삭제할까요? (이미 만든 일정은 그대로 남아요)')){ state.templates = state.templates.filter(t => t.id !== modal.draft.id); save(); closeModal(); render(); toast('템플릿을 삭제했어요'); }
      break;
  }
});
let dragId = null;
document.addEventListener('dragstart', e => {
  const c = e.target.closest && e.target.closest('[data-drag]');
  if (!c) return;
  dragId = c.dataset.drag; c.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId);
});
function clearDrop(){ document.querySelectorAll('.drop-before,.drop-after').forEach(x => x.classList.remove('drop-before','drop-after')); }
document.addEventListener('dragover', e => {
  if (!dragId) return;
  const c = e.target.closest && e.target.closest('[data-drag]');
  if (!c || !c.closest('[data-drop-list]')) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  clearDrop();
  if (c.dataset.drag === dragId) return;
  const r = c.getBoundingClientRect();
  c.classList.add(e.clientY < r.top + r.height / 2 ? 'drop-before' : 'drop-after');
});
document.addEventListener('drop', e => {
  if (!dragId) return;
  const c = e.target.closest && e.target.closest('[data-drag]');
  const listEl = c && c.closest('[data-drop-list]');
  if (!listEl){ return; }
  e.preventDefault();
  const date = listEl.dataset.dropList;
  const list = eventsOn(date);
  const from = list.findIndex(x => x.id === dragId);
  let to = list.findIndex(x => x.id === c.dataset.drag);
  const r = c.getBoundingClientRect();
  if (e.clientY >= r.top + r.height / 2) to += 1;      // 대상 카드 아래쪽에 놓음
  if (from < to) to -= 1;
  const id = dragId; dragId = null; clearDrop();
  reorderDay(date, id, to);
});
document.addEventListener('dragend', () => { dragId = null; clearDrop(); document.querySelectorAll('.dragging').forEach(x => x.classList.remove('dragging')); });

/* ---------- 메모 트리 드래그: 폴더로 이동 / 순서 바꾸기 ---------- */
let tdrag = null;   // { kind:'note'|'folder', id }
function clearTreeDrop(){ document.querySelectorAll('.drop-into,.drop-before,.drop-after,.drop-root').forEach(x => x.classList.remove('drop-into','drop-before','drop-after','drop-root')); }
document.addEventListener('dragstart', e => {
  const r = e.target.closest && e.target.closest('[data-ndrag], [data-fdrag]');
  if (!r) return;
  tdrag = r.dataset.ndrag ? { kind:'note', id:r.dataset.ndrag } : { kind:'folder', id:r.dataset.fdrag };
  r.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', tdrag.id); } catch(x){}
});
document.addEventListener('dragover', e => {
  if (!tdrag) return;
  const row = e.target.closest && e.target.closest('.folder-row, .note-row');
  const scroll = e.target.closest && e.target.closest('.tree-scroll');
  if (!row && !scroll) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'move'; clearTreeDrop();
  if (row && row.dataset.fdrop != null){                     // 폴더 위
    if (tdrag.kind === 'folder' && (tdrag.id === row.dataset.fdrop || descendantFolderIds(tdrag.id).includes(row.dataset.fdrop))) return;  // 자기 자신/하위로는 불가
    row.classList.add('drop-into');
  } else if (row && row.dataset.ndrag && tdrag.kind === 'note'){
    if (row.dataset.ndrag === tdrag.id) return;
    const rc = row.getBoundingClientRect();
    row.classList.add(e.clientY < rc.top + rc.height/2 ? 'drop-before' : 'drop-after');
  } else if (scroll && !row){ scroll.classList.add('drop-root'); }
});
document.addEventListener('drop', e => {
  if (!tdrag) return;
  const row = e.target.closest && e.target.closest('.folder-row, .note-row');
  const scroll = e.target.closest && e.target.closest('.tree-scroll');
  const d = tdrag; tdrag = null; clearTreeDrop();
  if (!row && !scroll) return;
  e.preventDefault();
  if (d.kind === 'folder'){
    const f = folderById(d.id); if (!f) return;
    if (row && row.dataset.fdrop != null){
      const tf = row.dataset.fdrop;
      if (tf === d.id || descendantFolderIds(d.id).includes(tf)) return;  // 순환 방지
      f.parentId = tf; delete f.order; ui.folderOpen.add(tf); save(); render(); toast('폴더를 옮겼어요');
    } else if (scroll && !row){ f.parentId = ''; delete f.order; save(); render(); toast('최상위로 옮겼어요'); }
    return;
  }
  const note = state.notes.find(n => n.id === d.id); if (!note) return;
  if (row && row.dataset.fdrop != null){ moveNoteToFolder(note, row.dataset.fdrop); }
  else if (row && row.dataset.ndrag){
    const tgt = state.notes.find(n => n.id === row.dataset.ndrag); if (!tgt) return;
    const rc = row.getBoundingClientRect();
    reorderNoteNear(note, tgt, e.clientY >= rc.top + rc.height/2);
  } else if (scroll && !row){ moveNoteToFolder(note, ''); }
});
document.addEventListener('dragend', () => { if (tdrag){ tdrag = null; clearTreeDrop(); document.querySelectorAll('.dragging').forEach(x => x.classList.remove('dragging')); } });
function moveNoteToFolder(note, fid){
  const same = (note.folderId||'') === (fid||'');
  note.folderId = fid || ''; delete note.order;                 // 폴더 맨 끝으로
  if (fid) ui.folderOpen.add(fid);
  ui.noteSel = note.id; save(); render(); if (!same) toast(fid ? '폴더로 옮겼어요' : '최상위로 옮겼어요');
}
function reorderNoteNear(note, target, after){
  const fid = target.folderId || '';
  note.folderId = fid;
  const list = folderNotes(fid).filter(n => n.id !== note.id);
  let idx = list.findIndex(n => n.id === target.id);
  if (after) idx += 1;
  list.splice(Math.max(0, idx), 0, note);
  list.forEach((n, i) => { n.order = i; });
  ui.noteSel = note.id; save(); render();
}
document.addEventListener('dblclick', e => {
  if (!e.target.closest) return;
  const nv = e.target.closest('.note-view');                 // 메모 뷰어 더블클릭 → 편집
  if (nv && !e.target.closest('a, input, button, label')){
    const id = (modal && modal.type === 'note-view') ? modal.id : ui.noteSel;
    if (id){ e.preventDefault(); openNote(id); return; }

  const chip = e.target.closest('[data-ev]');
  if (chip){ e.preventDefault(); closeQuick(); openEvent(chip.dataset.ev); return; }
  const c = e.target.closest('.cell[data-date]');

});

/* ---------- 빠른 추가 (날짜 더블클릭) ----------
   "14:00 미팅", "오후 2시 회의", "9시 반 보고" 처럼 앞에 시간을 쓰면 시간도 들어간다. */
function parseQuick(text){
  let t = text.trim(), time = '';
  const m = t.match(/^(오전|오후)?\s*(\d{1,2})(?::(\d{2})|시(?:\s*(\d{1,2})\s*분|\s*(반))?)\s*/);
  if (m){
    let h = +m[2];
    const mi = m[3] ? +m[3] : m[4] ? +m[4] : m[5] ? 30 : 0;
    if (m[1] === '오후' && h < 12) h += 12;
    if (m[1] === '오전' && h === 12) h = 0;
    if (h < 24 && mi < 60){ time = pad(h) + ':' + pad(mi); t = t.slice(m[0].length).trim(); }
  }
  return { time, title: t };
}
let quick = null;
function closeQuick(){ const q = document.getElementById('quick'); if (q) q.remove(); quick = null; }
function openQuick(date, anchor){
  closeQuick();
  quick = { date };
  const box = document.createElement('div');
  box.className = 'quick'; box.id = 'quick';
  box.setAttribute('role', 'dialog'); box.setAttribute('aria-label', fmtLong(date) + ' 빠른 추가');
  box.innerHTML = `
    <div class="quick-h"><b>${fmtLong(date)}</b><button class="icon-btn" data-act="quick-close" aria-label="닫기">${ICON.x}</button></div>
    <input class="inp" id="quick-inp" placeholder="예: 14:00 거래처 미팅" autocomplete="off">
    <div class="quick-f">
      <select class="inp" id="quick-tpl" aria-label="템플릿"><option value="">템플릿 없음</option>${state.templates.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select>
      <button class="btn sm" data-act="quick-more">자세히</button>
      <button class="btn sm primary" data-act="quick-save">추가</button>
    </div>
    <div class="hint">Enter 추가 · Esc 취소 · 앞에 시간을 쓰면 시간도 들어가요</div>`;
  document.body.appendChild(box);
  const r = anchor.getBoundingClientRect(), w = box.offsetWidth, h = box.offsetHeight;
  const left = Math.max(8, Math.min(innerWidth - w - 8, r.left));
  const top = r.bottom + 6 + h > innerHeight - 8 ? Math.max(8, r.top - h - 6) : r.bottom + 6;
  box.style.left = left + 'px'; box.style.top = top + 'px';
  document.getElementById('quick-inp').focus();
}
function quickDraft(){
  const text = document.getElementById('quick-inp').value;

  const { time, title } = parseQuick(text);
  const d = { id:uid(), title, date:quick.date, time, memo:'', color:COLORS[0], templateId:'', done:false, tasks:[], items:[], repeat:'none', repeatCount:4, monthMode:'date' };

function hlLine(line, isTitle){

  let prefix = esc(indent), m;

  else if (m = rest.match(/^(\[[ xX]\]\s)/)){ prefix += `<span class="hl-chk">${esc(m[1])}</span>`; rest = rest.slice(m[1].length); }

function closeSwitcher(){ const el = document.getElementById('switcher'); if (el) el.remove(); }
function openSwitcher(){
  if (document.getElementById('switcher')) return;
  const ov = document.createElement('div'); ov.className = 'sw-overlay'; ov.id = 'switcher';
  ov.innerHTML = `<div class="sw-box"><input class="inp sw-input" id="swInput" placeholder="메모로 이동 — 제목·내용 검색 (↑↓ Enter)" autocomplete="off"><div class="sw-list" id="swList"></div></div>`;
  document.body.appendChild(ov);
  ov.addEventListener('mousedown', e => { if (e.target === ov) closeSwitcher(); });
  const inp = document.getElementById('swInput');
  inp.addEventListener('input', swRender);
  inp.addEventListener('keydown', e => {
    const items = [...document.querySelectorAll('.sw-item')];
    if (e.key === 'ArrowDown'){ e.preventDefault(); swIdx = Math.min(items.length-1, swIdx+1); swHi(); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); swIdx = Math.max(0, swIdx-1); swHi(); }
    else if (e.key === 'Enter'){ e.preventDefault(); if (items[swIdx]) swOpen(items[swIdx].dataset.id); }
    else if (e.key === 'Escape'){ e.preventDefault(); closeSwitcher(); }
  });
  swRender(); inp.focus();
}

function mdMark(kind){
  const ta = document.querySelector('[data-f="body"]'); if (!ta || !modal) return;
  const { selectionStart:ss, selectionEnd:se, value } = ta;
  const lineStart = value.lastIndexOf('\n', ss-1) + 1;
  let lineEnd = value.indexOf('\n', se); if (lineEnd < 0) lineEnd = value.length;
  let num = kind === 'num' ? prevNumber(value, lineStart) + 1 : 1;
  const out = value.slice(lineStart, lineEnd).split('\n').map(l => {
    const indent = l.match(/^ */)[0];
    const rest = l.slice(indent.length).replace(/^(\d+\.\s|[-•]\s|\[[ xX]\]\s|#{1,3}\s)/, '');
    const mk = kind==='num' ? (num++)+'. ' : kind==='bul' ? '- ' : kind==='chk' ? '[ ] ' : '# ';
    return indent + mk + rest;
  }).join('\n');
  const nv = value.slice(0, lineStart) + out + value.slice(lineEnd);
  ta.value = nv; modal.draft.body = nv; ta.focus();
  if (ss === se){ const c = lineStart + out.length; ta.setSelectionRange(c, c); }   // 한 줄이면 커서를 끝에
  else ta.setSelectionRange(lineStart, lineStart + out.length);                      // 여러 줄이면 블록 선택
}
const INDENT = '  ';                                    // 한 단계 = 2칸
const levelStyle = lvl => ['dot','paren','circle'][lvl % 3];
// 들여쓰기 깊이에 따라 번호 서식과 번호를 다시 매김 (1. → 1) → ①, 레벨별 1부터)
function renumber(body){
  const lines = String(body).split('\n');
  const counters = [];
  for (let i = 0; i < lines.length; i++){
    const line = lines[i];
    if (!line.trim()){ counters.length = 0; continue; }   // 빈 줄 → 목록 끊김
    const nm = numMarker(line);
    if (!nm) continue;                                    // 번호 아닌 줄은 영향 없음
    const lvl = Math.floor(nm.indent.length / INDENT.length);
    counters[lvl] = (counters[lvl] || 0) + 1;
    counters.length = lvl + 1;                            // 더 깊은 레벨 번호 리셋
    lines[i] = nm.indent + numMk(levelStyle(lvl), counters[lvl]) + line.slice(nm.indent.length + nm.mk.length);
  }
  return lines.join('\n');
}
function setCaretLineEnd(ta, value, li){
  const lines = value.split('\n'); let off = 0;
  for (let i = 0; i < li; i++) off += lines[i].length + 1;
  const c = off + (lines[li] ? lines[li].length : 0); ta.setSelectionRange(c, c);
}
// Tab/Shift+Tab: 번호 줄이면 한 단계 들여쓰기/내어쓰기 후 서식·번호 자동 (아니면 false)
function indentNumbered(ta, outdent){
  const value = ta.value, ss = ta.selectionStart;
  const lineStart = value.lastIndexOf('\n', ss-1) + 1;
  let lineEnd = value.indexOf('\n', ss); if (lineEnd < 0) lineEnd = value.length;
  const line = value.slice(lineStart, lineEnd);
  if (!numMarker(line)) return false;
  const li = value.slice(0, lineStart).split('\n').length - 1;
  const newLine = outdent ? (line.startsWith(INDENT) ? line.slice(INDENT.length) : line) : INDENT + line;
  let nv = value.slice(0, lineStart) + newLine + value.slice(lineEnd);
  nv = renumber(nv);
  ta.value = nv; modal.draft.body = nv; setCaretLineEnd(ta, nv, li);
  return true;
}
function smartEnter(ta){
  if (ta.selectionStart !== ta.selectionEnd) return false;
  const ss = ta.selectionStart, value = ta.value;
  const lineStart = value.lastIndexOf('\n', ss-1) + 1;
  const line = value.slice(lineStart, ss);
  const nm = numMarker(line);
  let indent, content, mk;
  if (nm){
    indent = nm.indent; content = line.slice(nm.indent.length + nm.mk.length); mk = numMk(nm.style, nm.num + 1);
  } else {
    const m = line.match(/^(\s*)([-•])\s(.*)$/) || line.match(/^(\s*)(\[[ xX]\])\s(.*)$/);
    if (!m) return false;
    indent = m[1]; content = m[3]; mk = (m[2]==='-'||m[2]==='•') ? m[2] + ' ' : '[ ] ';
  }
  if (!content.trim()){                                    // 빈 항목에서 Enter → 목록 종료
    const nv = value.slice(0, lineStart) + indent + value.slice(ss);
    ta.value = nv; const c = lineStart + indent.length; ta.setSelectionRange(c, c); modal.draft.body = nv; return true;
  }
  const ins = '\n' + indent + mk;
  const newLi = value.slice(0, ss).split('\n').length;    // 새로 생기는 줄의 인덱스
  let nv = value.slice(0, ss) + ins + value.slice(ss);
  nv = renumber(nv);                                       // 번호 일관성 유지
  ta.value = nv; modal.draft.body = nv; setCaretLineEnd(ta, nv, newLi); return true;
}
function indentBody(ta, outdent){
  const { selectionStart:ss, selectionEnd:se, value } = ta;
  const lineStart = value.lastIndexOf('\n', ss-1) + 1;
  let lineEnd = value.indexOf('\n', se); if (lineEnd < 0) lineEnd = value.length;
  const out = value.slice(lineStart, lineEnd).split('\n').map(l => {
    if (outdent){ const rm = l.match(/^ {1,2}/); return rm ? l.slice(rm[0].length) : l; }
    return '  ' + l;
  }).join('\n');
  const nv = value.slice(0, lineStart) + out + value.slice(lineEnd);
  ta.value = nv; modal.draft.body = nv; ta.setSelectionRange(lineStart, lineStart + out.length);
}

function stepPeriod(dir){
  if (ui.view === 'week'){ ui.weekAnchor = ymd(addDays(parse(ui.weekAnchor), 7*dir)); render(); }
  else if (ui.view === 'month'){
    const [y,m] = ui.monthAnchor.split('-').map(Number);
    const d = new Date(y, m-1+dir, 1);
    ui.monthAnchor = `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
    ui.selDate = ui.monthAnchor === todayStr().slice(0,7) ? todayStr() : ui.monthAnchor + '-01';
    render();
  }
}
document.addEventListener('keydown', e => {
  const t = e.target;
  if ((e.ctrlKey || e.metaKey) && e.code === 'KeyP'){ e.preventDefault(); openSwitcher(); return; }
  if (document.getElementById('switcher')) return;   // 전환창이 자체 키 처리
  if (quick){
    if (e.key === 'Escape'){ e.preventDefault(); closeQuick(); return; }
    if (e.key === 'Enter' && !e.isComposing && t.id === 'quick-inp'){ e.preventDefault(); saveQuick(); return; }
  }
  if (e.key === 'Escape' && document.getElementById('linkMenu')){ closeLinkMenu(); return; }
  if (e.key === 'Escape' && modal){ closeModal(); return; }
  if (e.key === 'Enter' && !e.isComposing && t.dataset && t.dataset.leNew){ e.preventDefault(); addListItem(t.dataset.leNew, t.value); return; }
  const mod = e.ctrlKey || e.metaKey;
  if (modal){
    const inBody = modal.type === 'note' && t.dataset && t.dataset.f === 'body';
    if (inBody && e.key === 'Tab'){ e.preventDefault(); if (!indentNumbered(t, e.shiftKey)) indentBody(t, e.shiftKey); return; }
    if (inBody && e.key === 'Enter' && !mod && !e.isComposing){ if (smartEnter(t)){ e.preventDefault(); } return; }
    if (inBody && mod && e.shiftKey && (e.code === 'Digit7' || e.code === 'Digit8' || e.code === 'Digit9')){ e.preventDefault(); mdMark(e.code === 'Digit7' ? 'num' : e.code === 'Digit8' ? 'bul' : 'chk'); return; }
    if (inBody && mod && !e.shiftKey && e.code === 'KeyB'){ e.preventDefault(); wrapSel('**','**'); return; }
    if (inBody && mod && !e.shiftKey && e.code === 'KeyU'){ e.preventDefault(); wrapSel('__','__'); return; }
    if (inBody && mod && e.shiftKey && e.code === 'KeyH'){ e.preventDefault(); wrapSel('==','=='); return; }
    if (mod && (e.key === 'Enter' || e.code === 'KeyS')){
      e.preventDefault();
      if (modal.type === 'event') saveEvent(); else if (modal.type === 'template') saveTemplate(); else if (modal.type === 'note') saveNote(); else if (modal.type === 'folder') saveFolder();
    }
    return;
  }
  if (mod || e.altKey || e.isComposing || isTyping(t)) return;
  if (e.code === 'Slash' && e.shiftKey){ e.preventDefault(); openHelp(); return; }
  if (e.shiftKey) return;
  const act = {
    Digit1:() => goView('month'), Digit2:() => goView('week'), Digit3:() => goView('today'), Digit4:() => goView('notes'),
    KeyM:() => openNote(null),       // 새 메모
    Digit5:() => goView('settings'),
    ArrowLeft:() => stepPeriod(-1), ArrowRight:() => stepPeriod(1),
    BracketLeft:() => toggleSide(),
    KeyN:() => openEvent(null, fabDate()),
    KeyP:() => { openEvent(null, fabDate()); setTimeout(() => { const sel = document.querySelector('[data-tpl-select]'); if (sel){ sel.focus(); if (sel.showPicker) try { sel.showPicker(); } catch(err){} } }, 40); },
    KeyR:() => { if (syncCfg.key) sync(true); else toast('동기화가 꺼져 있어요'); },
  }[e.code];
  if (act){ e.preventDefault(); act(); }
});

function importData(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const next = normalize(JSON.parse(r.result));
        if (!confirm(`일정 ${next.events.length}개, 템플릿 ${next.templates.length}개로 현재 데이터를 바꿀까요?`)) return;
        state = next; save(); render(); toast('가져오기 완료');
      } catch(err){ toast('백업 파일을 읽을 수 없어요'); }
    };
    r.readAsText(f);
  };
  inp.click();

/* ---------- 기기 간 동기화 (종단간 암호화) ----------
   - 동기화 키(25자, 약 125비트 난수)는 기기에만 저장되고 서버로 가지 않는다.
   - 키에서 HKDF로 ① AES-256-GCM 암호화 키 ② 저장소 ID를 만든다.
   - 서버(Supabase)에는 [저장소 ID, 암호문, 버전]만 저장된다.
   - 템플릿/일정은 id 단위로 "나중에 수정한 쪽"이 이기고, 삭제는 삭제 기록으로 전파된다.
   - 보기 설정(테마·주 시작)은 기기마다 따로 둔다. */
const SYNC_KEY = 'workcal.sync';
const CONF = window.WORKCAL_CONFIG || {};
const syncCfg = (() => {
  const d = { url: CONF.supabaseUrl || '', anon: CONF.supabaseKey || '', key:'', lastSync:0, lastError:'' };
  try { return { ...d, ...JSON.parse(localStorage.getItem(SYNC_KEY) || '{}') }; } catch(e){ return d; }
})();
const cfgDraft = { url: syncCfg.url, anon: syncCfg.anon, joinkey:'' };
function saveCfg(){ try { localStorage.setItem(SYNC_KEY, JSON.stringify(syncCfg)); } catch(e){} }
const cryptoOK = !!(window.crypto && crypto.subtle);
let syncing = false, syncAgain = false, syncTimer = null;

const ALPHA = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';   // Crockford Base32 (헷갈리는 I L O U 제외)
function genKey(){
  const r = crypto.getRandomValues(new Uint8Array(25));
  const s = Array.from(r, b => ALPHA[b & 31]).join('');
  return s.match(/.{5}/g).join('-');
}
function normKey(s){
  const c = String(s || '').toUpperCase().replace(/[^0-9A-Z]/g, '').replace(/O/g,'0').replace(/[IL]/g,'1');
  if (c.length !== 25 || [...c].some(ch => !ALPHA.includes(ch))) return '';
  return c.match(/.{5}/g).join('-');
}
const te = new TextEncoder(), td = new TextDecoder();
const hex = buf => Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2,'0')).join('');
function b64(bytes){ let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); }
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let keyCache = null;
async function deriveKeys(key){
  if (keyCache && keyCache.key === key) return keyCache;
  const base = await crypto.subtle.importKey('raw', te.encode(key.replace(/-/g,'')), 'HKDF', false, ['deriveKey','deriveBits']);
  const salt = te.encode('workcal-sync-v1');
  const aes = await crypto.subtle.deriveKey({ name:'HKDF', hash:'SHA-256', salt, info:te.encode('encryption') }, base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
  const vid = hex(await crypto.subtle.deriveBits({ name:'HKDF', hash:'SHA-256', salt, info:te.encode('vault-id') }, base, 256));
  return (keyCache = { key, aes, vid });
}
async function encryptJSON(aes, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name:'AES-GCM', iv }, aes, te.encode(JSON.stringify(obj))));
  return JSON.stringify({ v:1, iv:b64(iv), ct:b64(ct) });
}
async function decryptJSON(aes, text){
  try {
    const p = JSON.parse(text);
    const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:unb64(p.iv) }, aes, unb64(p.ct));
    return JSON.parse(td.decode(pt));
  } catch(e){ throw new Error('동기화 키가 맞지 않거나 데이터가 손상됐어요'); }
}
async function rpc(fn, body){
  const headers = { 'Content-Type':'application/json', apikey: syncCfg.anon };
  if (!syncCfg.anon.startsWith('sb_')) headers.Authorization = 'Bearer ' + syncCfg.anon;   // 예전 anon(JWT) 키
  let r;
  try { r = await fetch(syncCfg.url.replace(/\/+$/,'') + '/rest/v1/rpc/' + fn, { method:'POST', headers, body: JSON.stringify(body) }); }
  catch(e){ throw new Error('서버에 연결할 수 없어요 (인터넷/주소 확인)'); }
  if (!r.ok){
    let msg = ''; try { msg = (await r.json()).message || ''; } catch(e){}
    throw new Error(r.status === 404 ? '서버에 동기화 함수가 없어요 (supabase.sql 실행 확인)'
      : r.status === 401 || r.status === 403 ? '서버 키가 맞지 않아요' : `서버 오류 ${r.status} ${msg}`.trim());
  }
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}

const byId = (p, q) => p.id < q.id ? -1 : p.id > q.id ? 1 : 0;
const syncPart = s => ({ events:[...s.events].sort(byId), templates:[...s.templates].sort(byId), notes:[...s.notes].sort(byId), folders:[...s.folders].sort(byId), noteTemplates:[...s.noteTemplates].sort(byId), deleted:s.deleted });
function canon(d){
  const del = {}; Object.keys(d.deleted).sort().forEach(k => del[k] = d.deleted[k]);
  return JSON.stringify({ e:[...d.events].sort(byId), t:[...d.templates].sort(byId), n:[...d.notes].sort(byId), f:[...d.folders].sort(byId), nt:[...d.noteTemplates].sort(byId), d:del });
}
function mergeData(a, b){
  const deleted = { ...a.deleted };
  for (const [k, v] of Object.entries(b.deleted || {})) if (!(deleted[k] >= v)) deleted[k] = v;
  const old = Date.now() - 1000*60*60*24*180;                 // 180일 지난 삭제 기록은 정리
  for (const k of Object.keys(deleted)) if (deleted[k] < old) delete deleted[k];
  const pick = (x, y) => {
    const m = new Map();
    for (const it of [...x, ...y]){ const c = m.get(it.id); if (!c || (it.updatedAt||0) > (c.updatedAt||0)) m.set(it.id, it); }
    return [...m.values()].filter(it => !(deleted[it.id] != null && deleted[it.id] >= (it.updatedAt||0))).sort(byId);
  };
  return { events: pick(a.events, b.events), templates: pick(a.templates, b.templates), notes: pick(a.notes, b.notes), folders: pick(a.folders, b.folders), noteTemplates: pick(a.noteTemplates, b.noteTemplates), deleted };
}

function scheduleSync(){
  if (!syncCfg.key) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => sync(false), 1200);
}
async function sync(manual){
  if (!syncCfg.key || !cryptoOK) return;
  if (syncing){ syncAgain = true; return; }
  syncing = true; render();
  try {
    const { aes, vid } = await deriveKeys(syncCfg.key);
    let done = false;
    for (let attempt = 0; attempt < 5 && !done; attempt++){
      const remote = await rpc('get_vault', { p_vid: vid });
      const rev = remote ? Number(remote.rev) : 0;
      const local = syncPart(state);
      let merged = local, rdata = null;
      if (remote){
        const r = normalize(await decryptJSON(aes, remote.data));
        rdata = { events:r.events, templates:r.templates, notes:r.notes, folders:r.folders, noteTemplates:r.noteTemplates, deleted:r.deleted };
        merged = mergeData(local, rdata);
      }
      if (canon(merged) !== canon(local)){                       // 다른 기기 변경분 반영
        state.events = merged.events; state.templates = merged.templates; state.notes = merged.notes; state.folders = merged.folders; state.noteTemplates = merged.noteTemplates; state.deleted = merged.deleted;
        persist(); snapshot();
      }
      if (!rdata || canon(merged) !== canon(rdata)){             // 서버로 올릴 게 있으면 업로드
        const res = await rpc('put_vault', { p_vid: vid, p_data: await encryptJSON(aes, merged), p_rev: rev });
        if (!res || !res.ok) continue;                           // 그 사이 다른 기기가 먼저 올림 → 다시 받아서 병합
      }
      done = true;
    }
    if (!done) throw new Error('다른 기기와 동시에 저장 중이에요. 잠시 후 다시 시도해요');
    syncCfg.lastSync = Date.now(); syncCfg.lastError = '';
    if (manual) toast('동기화 완료');
  } catch(e){
    syncCfg.lastError = e.message;
    if (manual) toast(e.message);
  } finally {
    syncing = false; saveCfg(); render();
    if (syncAgain){ syncAgain = false; scheduleSync(); }
  }
}
function takeConn(){
  const url = (cfgDraft.url || '').trim(), anon = (cfgDraft.anon || '').trim();
  if (!/^https:\/\/[^\s/]+/.test(url) && !/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?/.test(url)){ toast('Supabase URL을 확인해 주세요 (https://xxxx.supabase.co)'); return false; }
  if (!anon){ toast('Supabase 공개 키를 입력해 주세요'); return false; }
  syncCfg.url = url; syncCfg.anon = anon; return true;
}
async function syncCreate(){
  if (!takeConn()) return;
  syncCfg.key = genKey(); syncCfg.lastError = ''; ui.showKey = true; saveCfg();
  await sync(true);
  if (syncCfg.lastError){ syncCfg.key = ''; ui.showKey = false; saveCfg(); render(); }
  else toast('동기화 키를 만들었어요. 폰에서 이 키로 연결하세요');
}
async function syncJoin(){
  const k = normKey(cfgDraft.joinkey);
  if (!k){ toast('키 형식이 맞지 않아요 (5자리 × 5묶음)'); return; }
  if (!takeConn()) return;
  try {
    const { vid } = await deriveKeys(k);
    const remote = await rpc('get_vault', { p_vid: vid });
    if (!remote && !confirm('이 키로 저장된 데이터가 없어요. 오타가 아니라면 이 키로 새로 시작할까요?')) return;
  } catch(e){ toast(e.message); return; }
  syncCfg.key = k; syncCfg.lastError = ''; saveCfg();
  await sync(true);
}
function copyText(s){
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(s).then(() => toast('복사했어요'), () => prompt('복사하세요', s));
  else prompt('복사하세요', s);
}
const timeAgo = ts => {
  const m = Math.floor((Date.now() - ts) / 60000);
  if (m < 1) return '방금'; if (m < 60) return `${m}분 전`;
  const d = new Date(ts); return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
};
function syncPill(){
  if (!syncCfg.key) return '';
  const [cls, txt] = syncing ? ['', '동기화 중…'] : syncCfg.lastError ? ['err', '동기화 오류'] : ['ok', '동기화됨'];
  return `<button class="pill ${cls}" data-act="pill" title="${esc(syncCfg.lastError)}">${txt}</button>`;
}
function syncSection(){
  const head = '<div class="sec-h"><span>기기 간 동기화 · 개인 기기 전용</span></div>';
  if (!cryptoOK) return head + '<div class="panel"><div class="prow"><div class="grow d">이 주소에서는 암호화 기능을 쓸 수 없어요. HTTPS로 배포한 주소에서 열어 주세요.</div></div></div>';
  if (!syncCfg.key) return head + `
  <div class="panel">
    <div class="prow block"><div class="label">Supabase 프로젝트 URL</div><input class="inp" data-cfg="url" value="${esc(cfgDraft.url)}" placeholder="https://xxxx.supabase.co" autocomplete="off" spellcheck="false"></div>
    <div class="prow block"><div class="label">Supabase 공개 키 (anon 또는 publishable)</div><input class="inp" data-cfg="anon" value="${esc(cfgDraft.anon)}" placeholder="sb_publishable_… 또는 eyJ…" autocomplete="off" spellcheck="false"></div>
    <div class="prow"><div class="grow"><div class="t">첫 기기에서 시작</div><div class="d">동기화 키를 새로 만들고 지금 데이터를 올려요</div></div><button class="btn sm primary" data-act="sync-create">새로 시작</button></div>
    <div class="prow block"><div class="t" style="margin-bottom:6px">다른 기기에서 만든 키로 연결</div>
      <div class="inline"><input class="inp mono" data-cfg="joinkey" value="${esc(cfgDraft.joinkey)}" placeholder="XXXXX-XXXXX-XXXXX-XXXXX-XXXXX" autocapitalize="characters" autocomplete="off" spellcheck="false"><button class="btn sm" data-act="sync-join">연결</button></div></div>
  </div>
  <p class="note">일정은 이 기기에서 암호화한 뒤에 올라가서, 서버에는 알아볼 수 없는 데이터만 저장돼요. 회사 PC에서는 켜지 마세요.</p>`;
  const status = syncing ? '동기화 중…' : syncCfg.lastError ? '⚠️ ' + esc(syncCfg.lastError) : syncCfg.lastSync ? '마지막 동기화 ' + timeAgo(syncCfg.lastSync) : '아직 동기화 전';
  return head + `
  <div class="panel">
    <div class="prow"><div class="grow"><div class="t">상태</div><div class="d">${status}</div></div><button class="btn sm" data-act="sync-now">지금 동기화</button></div>
    <div class="prow"><div class="grow"><div class="t">동기화 키</div><div class="d mono">${ui.showKey ? esc(syncCfg.key) : '•••••-•••••-•••••'}</div></div>
      <button class="btn sm" data-act="sync-showkey">${ui.showKey ? '숨기기' : '보기'}</button><button class="btn sm" data-act="sync-copy">복사</button></div>
    <div class="prow"><div class="grow"><div class="t">이 기기 동기화 끄기</div><div class="d">이 기기 데이터는 그대로 남아요</div></div><button class="btn sm danger" data-act="sync-leave">끄기</button></div>
  </div>
  <p class="note">다른 기기에서 설정 → 동기화 → “키로 연결”에 이 키를 입력하세요. 키는 서버에 저장되지 않아서 잃어버리면 서버 데이터를 풀 수 없어요(각 기기 데이터는 남아요). 메신저보다는 직접 보고 입력하는 걸 권해요.</p>`;
}

document.addEventListener('scroll', e => { const t = e.target; if (t && t.dataset && t.dataset.f === 'body'){ const hl = document.getElementById('noteHl'); if (hl){ hl.scrollTop = t.scrollTop; hl.scrollLeft = t.scrollLeft; } } }, true);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') scheduleSync(); });
window.addEventListener('online', () => scheduleSync());
setInterval(() => { if (document.visibilityState === 'visible') sync(false); }, 60000);

/* ---------- Windows 프로그램(Tauri) 연동 ---------- */
const TAURI = window.__TAURI__ && window.__TAURI__.core;
let desk = null;            // { pinned, autostart }
async function deskCall(cmd, args){
  if (!TAURI) return;
  try { desk = await TAURI.invoke(cmd, args || {}); render(); }
  catch(e){ toast('프로그램 설정을 바꾸지 못했어요'); }
}
function deskSection(){
  if (!TAURI) return '';
  const d = desk || { pinned:false, autostart:false };
  return `
  <div class="sec-h"><span>Windows 프로그램</span></div>
  <div class="panel">
    <div class="prow"><div class="grow"><div class="t">바탕화면에 고정</div><div class="d">테두리 없이 다른 창들 뒤, 바탕화면 위에 늘 떠 있어요. 창 위치·크기를 먼저 맞춘 뒤 켜세요.</div></div>
      <button class="btn sm ${d.pinned?'primary':''}" data-act="desk-pin">${d.pinned?'켜짐':'꺼짐'}</button></div>
    <div class="prow"><div class="grow"><div class="t">Windows 시작 시 실행</div><div class="d">컴퓨터를 켜면 자동으로 열려요</div></div>
      <button class="btn sm ${d.autostart?'primary':''}" data-act="desk-auto">${d.autostart?'켜짐':'꺼짐'}</button></div>
  </div>
  <p class="note">창을 닫으면 작업 표시줄 오른쪽 트레이(⌃)로 들어가요. 완전히 끄려면 트레이 아이콘 우클릭 → 종료. 고정 해제는 여기, 왼쪽 메뉴 아래, 트레이 메뉴 어디서든 할 수 있어요.</p>`;
}
if (TAURI){
  deskCall('desktop_state');
  if (window.__TAURI__.event) window.__TAURI__.event.listen('desktop-state', () => deskCall('desktop_state'));
}

/* 안드로이드 앱(APK)의 뒤로가기 버튼: 편집 창 → 닫기, 다른 탭 → 오늘 탭, 오늘 탭 → 앱 종료 */
const CapApp = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()
  && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
if (CapApp){
  CapApp.addListener('backButton', () => {
    if (modal){ closeModal(); return; }
    if (ui.view !== 'today'){ ui.view = 'today'; scrollTop(); render(); return; }
    CapApp.exitApp();
  });
}

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

render();
scheduleSync();
})();
