[package]
name = "work-calendar"
version = "1.1.0"
description = "업무 캘린더 Windows 프로그램"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-window-state = "=2.5.0"
serde = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
